kind = "web"
previewPath = "/"
title = "Magic Orb Dashboard"
description = "แดชบอร์ดสำหรับติดตามสถานะโหนด บล็อกเชน สถิติระบบ และการตรวจสอบโค้ดแบบเรียลไทม์"
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22030

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/dashboard", "run", "start" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "22030"
BASE_PATH = "/"
