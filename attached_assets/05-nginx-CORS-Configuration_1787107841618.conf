# nginx configuration - CORS setup for Vercel deployment
# File: /etc/nginx/nginx.conf

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Map for CORS origin (whitelist your Vercel domain)
    map $http_origin $cors_origin {
        default "";
        # Add your Vercel deployment domains here
        "https://meechain-dashboard.vercel.app" "https://meechain-dashboard.vercel.app";
        "https://your-domain.vercel.app" "https://your-domain.vercel.app";
        # Allow localhost for development
        "http://localhost:3000" "http://localhost:3000";
    }

    # Upstream servers
    upstream meechain_api {
        server 127.0.0.1:5000;
    }
    
    upstream meechain_rpc {
        server 127.0.0.1:8545;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API Server (HTTPS)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.meechain.live;
        
        ssl_certificate /etc/letsencrypt/live/api.meechain.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.meechain.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS Headers - Allow Vercel & localhost
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '1728000' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' '1728000';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' '0';
            return 204;
        }

        location / {
            proxy_pass http://meechain_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "upgrade";
            proxy_set_header Upgrade $http_upgrade;
            
            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 24 4k;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://meechain_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            access_log off; # Don't log health checks
        }
    }

    # RPC Server (HTTPS)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rpc.meechain.live;
        
        ssl_certificate /etc/letsencrypt/live/rpc.meechain.live/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rpc.meechain.live/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS Headers for RPC
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Max-Age' '1728000' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' '1728000';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' '0';
            return 204;
        }

        location / {
            proxy_pass http://meechain_rpc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # RPC timeout
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # RPC buffering
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }
    }
}

# ═════════════════════════════════════════════════════════
# DEPLOYMENT INSTRUCTIONS
# ═════════════════════════════════════════════════════════

# 1. Copy this file to VM
# scp 05-nginx-CORS-Configuration.conf meechain@YOUR_VM_IP:/tmp/

# 2. SSH into VM
# ssh -i YOUR_KEY meechain@YOUR_VM_IP

# 3. Backup current config
# sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.backup.$(date +%Y%m%d)

# 4. Install new config
# sudo cp /tmp/05-nginx-CORS-Configuration.conf /etc/nginx/nginx.conf

# 5. Update Vercel domain if needed
# sudo nano /etc/nginx/nginx.conf
# # Find: https://meechain-dashboard.vercel.app
# # Replace with your actual Vercel domain

# 6. Test configuration
# sudo nginx -t
# # Expected: "test is successful"

# 7. Reload nginx
# sudo systemctl reload nginx

# 8. Verify CORS working
# curl -X OPTIONS -H "Origin: https://meechain-dashboard.vercel.app" \
#   -H "Access-Control-Request-Method: POST" \
#   https://api.meechain.live/
# # Expected: 200 OK with CORS headers

# ═════════════════════════════════════════════════════════
# TESTING CORS
# ═════════════════════════════════════════════════════════

# Test API endpoint with your Vercel domain:
# curl -X POST https://api.meechain.live/health \
#   -H "Origin: https://meechain-dashboard.vercel.app" \
#   -H "Access-Control-Request-Method: POST" \
#   -i

# Test RPC endpoint:
# curl -X POST https://rpc.meechain.live \
#   -H "Content-Type: application/json" \
#   -H "Origin: https://meechain-dashboard.vercel.app" \
#   -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
#   -i

# If you see these headers in response:
#   Access-Control-Allow-Origin: https://meechain-dashboard.vercel.app
#   Access-Control-Allow-Methods: GET, POST, OPTIONS
# Then CORS is working! ✅
